<html lang="ko">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="진실한숲교회의 앱들이 모여 사는 마을입니다. 집을 누르면 앱으로 들어갑니다.">
<meta name="theme-color" content="#a9dcf1">
<meta property="og:type" content="website">
<meta property="og:title" content="진숲마을">
<meta property="og:description" content="진실한숲교회의 앱들이 모여 사는 마을입니다. 집을 누르면 앱으로 들어갑니다.">
<meta property="og:image" content="https://najh100-a11y.github.io/village/og.png">
<meta property="og:url" content="https://najh100-a11y.github.io/village/">

<link rel="apple-touch-icon" href="icon.png">

<title>진숲마을</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: a full-bleed daytime island rendered in WebGL; small paper speech-bubble UI floats in the corners, and a bottom sheet opens for the house you tap. One deliberate daytime look, so colors are set explicitly rather than themed. */
:root{
  --sky:#a9dcf1;
  --sky-low:#e3f4ec;
  --ink:#233f2e;
  --ink-soft:#55695c;
  --paper:#fffdf6;
  --paper-edge:#e4dcc4;
  --leaf:#3d8a52;
  --leaf-deep:#2b693d;
  --sun:#f3bf45;
  --shade:rgba(35,63,46,.16);
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;overflow:hidden;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky-low) 72%);
  background-color:var(--sky-low);
  color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
.card[hidden],.list[hidden],.hint[hidden]{display:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#scene:active{cursor:grabbing}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.brand{
  position:fixed;z-index:3;pointer-events:none;
  top:calc(14px + env(safe-area-inset-top,0px));
  left:calc(16px + env(safe-area-inset-left,0px));
  max-width:min(58vw,340px);
}
.brand .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--leaf-deep)}
.brand h1{
  font-family:var(--display);font-weight:400;
  font-size:clamp(30px,6.4vw,42px);line-height:1;margin:2px 0 6px;
  color:var(--ink);text-wrap:balance;
  text-shadow:0 2px 0 var(--paper),0 0 18px var(--paper);
}
.brand p{margin:0;font-size:14px;color:var(--ink-soft);text-shadow:0 0 10px var(--paper)}

.tools{
  position:fixed;z-index:3;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;
  top:calc(14px + env(safe-area-inset-top,0px));
  right:calc(16px + env(safe-area-inset-right,0px));
  max-width:40vw;
}
.tool{
  font-family:var(--display);font-size:15px;line-height:1;color:var(--ink);
  background:var(--paper);border:2px solid var(--paper-edge);border-radius:999px;
  padding:9px 14px 8px;box-shadow:0 3px 0 var(--paper-edge);cursor:pointer;white-space:nowrap;
}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--paper-edge)}
.tool[aria-expanded="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:0 3px 0 var(--leaf-deep)}

#labels{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.label{
  position:absolute;left:0;top:0;pointer-events:auto;
  display:flex;align-items:center;gap:6px;
  font-family:var(--display);font-size:14px;line-height:1;color:var(--ink);
  background:var(--paper);border:0;border-radius:12px;padding:6px 10px 6px 8px;
  box-shadow:0 2px 0 var(--shade);white-space:nowrap;cursor:pointer;
  transition:background-color .2s,color .2s;
}
.label::after{
  content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--paper);border-bottom:0;
  transition:border-color .2s;
}
.label .dot,.li .dot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.label.on{background:var(--ink);color:var(--paper)}
.label.on::after{border-top-color:var(--ink)}

.hint{
  position:fixed;z-index:3;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  max-width:calc(100% - 32px);text-align:center;
  font-size:13px;color:var(--ink-soft);background:var(--paper);
  border-radius:999px;padding:7px 14px;box-shadow:0 2px 0 var(--shade);
  pointer-events:none;
}

.card{
  position:fixed;z-index:4;margin:0 auto;max-width:440px;
  left:calc(16px + env(safe-area-inset-left,0px));
  right:calc(16px + env(safe-area-inset-right,0px));
  bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--paper);border:2px solid var(--paper-edge);border-radius:22px;
  padding:16px 18px 18px;
  box-shadow:0 5px 0 var(--paper-edge),0 18px 40px var(--shade);
  display:flex;flex-direction:column;gap:6px;
}
.card:not([hidden]){animation:rise .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kind{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}
.roof{width:18px;height:12px;background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%);flex:none}
.x{
  font-family:var(--display);font-size:20px;line-height:1;width:34px;height:34px;border-radius:50%;
  border:2px solid var(--paper-edge);background:var(--paper);color:var(--ink-soft);cursor:pointer;
}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;margin:2px 0 0;text-wrap:balance}
.tag{margin:0;font-size:15px;color:var(--leaf-deep)}
.house{margin:0;font-size:13px;color:var(--ink-soft)}
.desc{margin:4px 0 0;max-width:62ch}
.note{margin:2px 0 0;font-size:13px;color:var(--ink-soft)}
.card-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.go{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--display);font-size:18px;line-height:1;text-decoration:none;
  color:var(--paper);background:var(--leaf);border-radius:14px;padding:13px 20px 12px;
  box-shadow:0 4px 0 var(--leaf-deep);
}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--leaf-deep)}
.go svg{width:16px;height:16px}
.hop{display:flex;gap:6px}
.hop button{
  width:40px;height:40px;border-radius:12px;border:2px solid var(--paper-edge);background:var(--paper);
  color:var(--ink);font-family:var(--display);font-size:20px;line-height:1;cursor:pointer;box-shadow:0 3px 0 var(--paper-edge);
}
.hop button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--paper-edge)}

.list{
  position:fixed;z-index:5;
  top:calc(62px + env(safe-area-inset-top,0px));
  right:calc(16px + env(safe-area-inset-right,0px));
  width:min(320px,calc(100vw - 32px));max-height:calc(100% - 90px);overflow:auto;
  background:var(--paper);border:2px solid var(--paper-edge);border-radius:20px;
  padding:14px 12px 10px;box-shadow:0 5px 0 var(--paper-edge),0 18px 40px var(--shade);
}
.list h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0 6px 8px}
.list ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.li{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  font:inherit;color:var(--ink);background:transparent;border:0;border-radius:12px;padding:9px 8px;cursor:pointer;
}
.li:hover{background:var(--sky-low)}
.li-t{display:flex;flex-direction:column;min-width:0}
.li-n{font-family:var(--display);font-size:16px;line-height:1.2}
.li-s{font-size:13px;color:var(--ink-soft)}

/* Without WebGL the village becomes a plain list */
.no3d #scene,.no3d #labels,.no3d .hint,.no3d #homeBtn{display:none}
.no3d .list{position:static;margin:110px auto 0;width:auto;max-width:440px}
.no3d .tools{display:none}

.brand{transition:opacity .3s}
@media (max-width:520px){
  .card-open .brand{opacity:0}
  .card h2{font-size:24px}
  .hint{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  .card:not([hidden]){animation:none}
}
</style>

</head>
<body>
<canvas id="scene" aria-label="진숲마을 3D 지도. 집을 누르면 앱 안내가 열립니다." tabindex="-1"></canvas>
<div id="labels"></div>

<header class="brand">
  <div class="eyebrow">진실한숲교회</div>
  <h1>진숲마을</h1>
  <p>우리 교회 앱들이 모여 사는 마을입니다</p>
</header>

<div class="tools">
  <button class="tool" id="homeBtn" type="button">마을 전체</button>
  <button class="tool" id="listBtn" type="button" aria-expanded="false" aria-controls="list">집 목록</button>
</div>

<nav class="list" id="list" hidden aria-label="마을의 집들">
  <h2>마을의 집들</h2>
  <ul id="listItems"></ul>
</nav>

<div class="hint" id="hint"></div>

<section class="card" id="card" hidden role="dialog" aria-labelledby="cardName">
  <div class="card-top">
    <div class="kind"><span class="roof"></span><span id="cardKind"></span></div>
    <button class="x" id="cardClose" type="button" aria-label="닫기">×</button>
  </div>
  <h2 id="cardName"></h2>
  <p class="tag" id="cardTag"></p>
  <p class="house" id="cardHouse"></p>
  <p class="desc" id="cardDesc"></p>
  <p class="note" id="cardNote"></p>
  <div class="card-actions">
    <a class="go" id="cardGo" href="#" target="_blank" rel="noopener"><span>들어가기</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg></a>
    <div class="hop">
      <button id="prevBtn" type="button" aria-label="이전 집">‹</button>
      <button id="nextBtn" type="button" aria-label="다음 집">›</button>
    </div>
  </div>
</section>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
(function(){
'use strict';
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
var coarse = matchMedia('(pointer: coarse)').matches;

/* The six houses. Text here comes from each app's own page. */
var APPS = [
  {name:'렉시오 디비나', tag:'말씀과 침묵의 기도',
   desc:'성경 본문을 고르고 침묵, 읽기, 묵상, 기도, 관상의 시간을 정해 두면 타이머와 싱잉볼 소리에 맞춰 말씀 앞에 머물 수 있습니다. 센터링 기도도 함께 들어 있습니다.',
   url:'https://dufenekffksxm-design.github.io/lectio-divina/', kind:'web', roof:'#7a5aa8', wall:'#fbf1e2', style:'monastery', house:'싱잉볼을 얹은 탑이 있는 돌집, 문 앞에는 펼쳐진 책'},
  {name:'말의 구원', tag:'깊은 샘에서 흘러나오는 말',
   desc:'2026년 10월 설교 시리즈와 함께 4주 동안 걷는 워크북입니다.',
   url:'https://najh100-a11y.github.io/word-training/', kind:'web', roof:'#3d7fc0', wall:'#e9f1f6', style:'spring', house:'샘물이 흘러나오는 둥근 집, 창문은 말풍선 모양'},
  {name:'1도의 가격', tag:'책읽기 모임, 함께 읽기',
   desc:'북클럽에서 읽은 내용의 요약과 나눔판, 토론 질문을 휴대폰으로 함께 보는 앱입니다.',
   url:'https://najh100-a11y.github.io/slow-burn/', kind:'web', roof:'#e0773f', wall:'#fdf3e6', style:'books', house:'책을 쌓아 올린 집, 지붕은 엎어 둔 책, 옆에는 커다란 온도계'},
  {name:'팀 셔플', tag:'조 편성 추첨 프로그램',
   desc:'교회 모임에서 조를 고르게 나눠 주는 추첨 프로그램입니다. Windows와 Mac에 설치해서 씁니다.',
   url:'https://github.com/najh100-a11y/team-shuffle/releases/tag/v1.0.0', kind:'desktop', roof:'#d4544c', roof2:'#3f7fbf', wall:'#f9ede4', style:'tent', house:'네 가지 팀 색깔로 칠한 천막, 문 앞에는 주사위'},
  {name:'풍성한 첫걸음', tag:'풍성한 삶으로 한 걸음씩 함께',
   desc:'풍성한 삶으로 한 걸음씩 함께 내딛도록 돕는 앱입니다.',
   url:'https://hanabokdna2026-dot.github.io/firststep/', kind:'web', roof:'#e5b333', wall:'#fbf6e6', style:'greenhouse', house:'새싹이 자라는 온실, 문 앞에 작은 발자국'},
  {name:'주님께 기도를 배우다', tag:'기도 앱',
   desc:'주님께 기도를 배우는 앱입니다.',
   url:'https://dufenekffksxm-design.github.io/prayer-app/', kind:'web', roof:'#3a9a87', wall:'#e9f3ea', style:'chapel', house:'스테인드글라스가 빛나는 작은 기도처'}
];
var NOTE_WEB = '열린 화면에서 공유 버튼이나 브라우저 메뉴의 "홈 화면에 추가"를 누르면 휴대폰에서 앱처럼 쓸 수 있습니다.';
var NOTE_DESK = '내려받는 곳에 Windows용과 Mac용(애플 실리콘, 인텔) 설치 파일이 있습니다. 처음 실행할 때 보안 경고가 나오면 저장소 안내문(README)을 따르면 됩니다.';

function $(s){ return document.querySelector(s); }
var card = $('#card'), list = $('#list'), listBtn = $('#listBtn'), hint = $('#hint');
var sel = -1, no3d = false;
var fly = function(){}, flyHome = function(){}, syncLabels = function(){};

hint.textContent = coarse ? '한 손가락으로 끌어 둘러보고, 집을 눌러 들어가세요' : '끌어서 둘러보기 · 휠로 가까이 · 집을 눌러 들어가기';

/* House list (also the fallback when 3D is unavailable) */
var ul = $('#listItems');
APPS.forEach(function(a, i){
  var li = document.createElement('li');
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'li'; b.style.setProperty('--c', a.roof);
  b.innerHTML = '<span class="dot"></span><span class="li-t"><span class="li-n"></span><span class="li-s"></span></span>';
  b.querySelector('.li-n').textContent = a.name;
  b.querySelector('.li-s').textContent = a.tag;
  b.addEventListener('click', function(){ select(i); if(!no3d) setList(false); });
  li.appendChild(b); ul.appendChild(li);
});
function setList(open){ list.hidden = !open; listBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
listBtn.addEventListener('click', function(){ setList(list.hidden); });
$('#homeBtn').addEventListener('click', function(){ setList(false); if(!card.hidden) closeCard(); else flyHome(); });

function showCard(i){
  var a = APPS[i]; sel = i;
  card.style.setProperty('--c', a.roof);
  $('#cardKind').textContent = a.kind === 'web' ? '휴대폰 웹앱' : 'Windows · Mac 프로그램';
  $('#cardName').textContent = a.name;
  $('#cardTag').textContent = a.tag;
  $('#cardDesc').textContent = a.desc;
  $('#cardHouse').textContent = a.house;
  $('#cardNote').textContent = a.kind === 'web' ? NOTE_WEB : NOTE_DESK;
  var go = $('#cardGo'); go.href = a.url;
  go.querySelector('span').textContent = a.kind === 'web' ? '들어가기' : '내려받는 곳으로';
  card.hidden = false; hint.hidden = true;
  document.body.classList.add('card-open');
  syncLabels();
}
function select(i){ showCard(i); fly(i); }
function closeCard(){ card.hidden = true; sel = -1; document.body.classList.remove('card-open'); if(!no3d) hint.hidden = false; syncLabels(); flyHome(); }
$('#cardClose').addEventListener('click', closeCard);
$('#prevBtn').addEventListener('click', function(){ select((sel + APPS.length - 1) % APPS.length); });
$('#nextBtn').addEventListener('click', function(){ select((sel + 1) % APPS.length); });
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ if(!list.hidden) setList(false); else if(!card.hidden) closeCard(); }
});

function webglOK(){
  try { var c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl'))); }
  catch(e){ return false; }
}
function fallback(){ no3d = true; document.body.classList.add('no3d'); hint.hidden = true; setList(true); }

if(!window.THREE || !THREE.OrbitControls || !webglOK()){ fallback(); return; }
try { init3D(); } catch(err){ console.error(err); fallback(); }

function init3D(){
  if(THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;
  var canvas = $('#scene');
  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, coarse ? 1.75 : 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x000000, 0);

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xdcefe9, 80, 175);
  var camera = new THREE.PerspectiveCamera(34, 1, 0.5, 400);
  var controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.enablePan = false; controls.minDistance = 12;
  controls.minPolarAngle = 0.42; controls.maxPolarAngle = 1.2;
  controls.rotateSpeed = 0.55; controls.zoomSpeed = 0.8;
  controls.autoRotateSpeed = 0.35;

  /* light */
  scene.add(new THREE.HemisphereLight(0xd6f0ff, 0x86b46a, 0.8));
  scene.add(new THREE.AmbientLight(0xffffff, 0.12));
  var sun = new THREE.DirectionalLight(0xfff0d4, 1.15);
  sun.position.set(18, 30, 14); sun.castShadow = true;
  var smap = coarse ? 1024 : 2048; sun.shadow.mapSize.set(smap, smap);
  var scam = sun.shadow.camera; scam.left = -23; scam.right = 23; scam.top = 23; scam.bottom = -23; scam.near = 1; scam.far = 90;
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
  scene.add(sun);

  /* helpers */
  function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rand = mulberry(11);
  var cache = {};
  function M(c, smooth){
    var k = c + (smooth ? 's' : 'f');
    if(!cache[k]) cache[k] = new THREE.MeshStandardMaterial({color:c, roughness:0.92, metalness:0, flatShading:!smooth});
    return cache[k];
  }
  function add(parent, geo, mat, x, y, z, cast){
    var m = new THREE.Mesh(geo, mat);
    m.position.set(x || 0, y || 0, z || 0);
    m.castShadow = cast !== false; m.receiveShadow = true;
    parent.add(m); return m;
  }
  function rbox(w, h, d, r){
    r = Math.min(r, Math.min(w, h, d) * 0.45);
    var s = new THREE.Shape(), hw = w / 2 - r, hh = h / 2 - r;
    s.moveTo(-hw, -hh); s.lineTo(hw, -hh); s.lineTo(hw, hh); s.lineTo(-hw, hh); s.closePath();
    var g = new THREE.ExtrudeGeometry(s, {depth:Math.max(0.001, d - 2 * r), bevelEnabled:true, bevelThickness:r, bevelSize:r, bevelSegments:2, curveSegments:1});
    g.center(); return g;

      controls.update();
    }
    for(var i = 0; i < houses.length; i++){
      var h = houses[i], want = (i === hover || i === sel) ? 1 : 0;
      h.lift += (want - h.lift) * Math.min(1, dt * 8);
      h.group.position.y = G + h.lift * 0.16 + (i === sel && !reduce ? Math.sin(T * 3) * 0.04 : 0);
      for(var gi = 0; gi < h.glows.length; gi++) h.glows[gi].emissiveIntensity = h.glows[gi].userData.base + h.lift * 0.9;
    }
    if(!reduce){
      var arr = wpos.array;
      for(var j = 0; j < arr.length; j += 3) arr[j + 1] = Math.sin(wbase[j] * 0.32 + T * 0.9) * 0.06 + Math.cos(wbase[j + 2] * 0.27 + T * 0.7) * 0.06;
      wpos.needsUpdate = true;
      foam.material.opacity = 0.5 + Math.sin(T * 1.3) * 0.2;
      clouds.rotation.y += dt * 0.012;
      for(var f = 0; f < flags.length; f++) flags[f].rotation.x = Math.sin(T * 2.2 + f * 0.7) * 0.3;
      for(var an = 0; an < anims.length; an++) anims[an](T);
      updateVillagers(dt, T);
    }
    placeLabels();
    renderer.render(scene, camera);
  }
  loop();
}
})();
</script>
